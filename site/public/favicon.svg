<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cloudflake">
  <rect width="64" height="64" fill="#FFFFFF"/>
  <!-- Cereal box front & side -->
  <polygon points="10,12 46,12 50,7 16,7" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="10" y="12" width="36" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="46,12 54,15 54,53 46,56" fill="#D32F2F" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="46,12 50,7 54,15" fill="#7A1A1A" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Red cloud -->
  <path d="M17 28 C14 28 13 23 17 22 C18 18 23 17 25 19 C27 15 34 15 36 20 C40 20 41 27 37 28 Z" fill="#D32F2F"/>
  <!-- Pink flakes -->
  <ellipse cx="20" cy="39" rx="5" ry="2.8" fill="#E9AAAA" stroke="#000000" stroke-width="1.8"/>
  <!-- Lightning bolt from cloud striking bowl -->
  <polygon points="32,26 26,37 31,37 27,48 39,35 33,35 37,26" fill="#FFFFFF" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cracked red cereal bowl (left & right pieces) -->
  <path d="M12 47 H25 L23 57 C17 56 13 52 12 47 Z" fill="#D32F2F" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M31 47 H44 C43 52 39 56 32 57 L29 52 Z" fill="#D32F2F" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
